# 这个文件是 .github/workflows/build-unsigned-ipa.yml 的可见副本，专为「在 GitHub 网页上传文件夹」准备。
# 原因：.github 是隐藏目录，网页拖拽上传时容易漏掉；漏掉后 Actions 就不会触发。
# 用法（仅在需要手动上传时）：
#   1) 把 mini-buddy 文件夹拖进 GitHub 仓库网页（其它文件照常上传）
#   2) 点 Add file → Create new file，文件名输入框里填：
#        .github/workflows/build-unsigned-ipa.yml
#      GitHub 会自动创建这两层目录
#   3) 把本文件「从下一行 name: 开始」的全部内容复制粘贴进去，提交即可
#   4) 之后到 Actions 页面手动 Run workflow
# 如果是由 WorkBuddy 通过 API 代传，隐藏目录会一并写入，本文件无需理会。
# ---------------------------------------------------------------------------
name: 生成未签名 iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project MiniBuddy.xcodeproj \
            -scheme MiniBuddy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: 打包成 ipa
        run: |
          set -euo pipefail
          APP="ios/build/Build/Products/Release-iphoneos/MiniBuddy.app"
          test -d "$APP" || { echo "找不到 MiniBuddy.app，编译可能失败"; exit 1; }
          rm -rf Payload MiniBuddy-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MiniBuddy-unsigned.ipa Payload
          unzip -l MiniBuddy-unsigned.ipa | head -20

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MiniBuddy-unsigned-ipa
          path: MiniBuddy-unsigned.ipa
          if-no-files-found: error
